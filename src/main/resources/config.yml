# ── Faction ──────────────────────────────────────────────────────────────────
faction:
  max-name-length: 20
  min-name-length: 3
  max-members: 50
  actionbar-update-interval: 20
  actionbar-range: 200

# ── Liaison compte web (/lier) ────────────────────────────────────────────────
# URL du site web — affichée dans le message /lier
site-url: "http://localhost:3000"

# Connexion MySQL — DOIT être la MÊME base que celle du site (variables GAME_DB_* dans .env)
mysql:
  host: "127.0.0.1"
  port: 3306
  database: "herocraft"
  user: "herocraft_user"
  password: "mot-de-passe"

# ── Messages ──────────────────────────────────────────────────────────────────
messages:
  prefix: "&8[&6Faction&8] &r"
  faction-created: "&aFaction &e%name% &acréée avec succès !"
  faction-disbanded: "&cFaction &e%name% &cdissoute."
  faction-not-found: "&cFaction introuvable."
  already-in-faction: "&cTu es déjà dans une faction."
  not-in-faction: "&cTu n'es pas dans une faction."
  not-chef: "&cTu n'es pas le chef de cette faction."
  player-not-found: "&cJoueur introuvable."
  invite-sent: "&aInvitation envoyée à &e%player%&a."
  invite-received: "&e%player% &at'invite dans la faction &e%faction%&a. Tape &b/faction join %faction% &apour rejoindre."
  joined-faction: "&aTu as rejoint la faction &e%name%&a."
  left-faction: "&cTu as quitté la faction &e%name%&c."
  chef-set: "&e%player% &aest maintenant chef de la faction."
  name-too-short: "&cLe nom de faction est trop court (min %min% caractères)."
  name-too-long: "&cLe nom de faction est trop long (max %max% caractères)."
  faction-already-exists: "&cUne faction avec ce nom existe déjà."
  no-invite: "&cTu n'as pas d'invitation pour cette faction."
  faction-full: "&cLa faction est complète."
  cannot-invite-self: "&cTu ne peux pas t'inviter toi-même."
  player-already-in-faction: "&c%player% est déjà dans une faction."

# ── Synchronisation carte web ─────────────────────────────────────────────────
# Clé API partagée avec le site (FACTION_API_KEY dans le .env du site)
faction-api-key: "change-moi"

webmap:
  # Noms des mondes à tracker (dossiers dans le répertoire du serveur)
  worlds-tracked:
    - faction
  # Afficher les requêtes HTTP dans la console
  debug: false

# ── Villageois recrutés (v5.9) ─────────────────────────────────────────────────
villager:
  # Intervalle de la boucle d'IA principale (en ticks Minecraft, 20 = 1 s)
  tick-interval: 20
  # Nombre maximum de villageois recrutés par faction
  max-per-faction: 5
  # Quantité de vie rendue à chaque item de nourriture consommé
  heal-per-food: 4.0
  # Points de patrouille max par villageois
  max-patrol-points: 10
  # Seuil de blocs en réserve avant que le Constructeur aille lui-même en zone de récolte
  gather-batch-size: 8
  # Distance à partir de laquelle un Constructeur peut se téléporter pour avancer plus vite
  task-teleport-distance: 64.0

  # ── Soin par le sommeil (nouveau en v5.9.4) ──────────────────────────────────
  # Vie rendue à chaque tick de soin pendant le sommeil
  heal-per-sleep-tick: 2.0
  # Nombre de soins appliqués tant que le villageois reste au lit
  sleep-heal-ticks: 8
  # Période entre deux soins pendant le sommeil (en ticks, 60 = 3 s)
  sleep-heal-period: 60

  # ── Mode archerie du Guerrier (nouveau en v5.9.4) ───────────────────────────
  # Distance d'engagement idéale (le guerrier recule si l'ennemi est plus proche)
  archer-min-distance: 6.0
  # Distance maximale de tir (au-delà, il s'avance pour rester efficace)
  archer-max-distance: 18.0
  # Cooldown minimum entre deux tirs (en ms)
  archer-cooldown-ms: 1500
  # Dégâts infligés par chaque flèche tirée
  archer-damage: 3.0
