name: FactionPlugin
version: 5.15.4
main: fr.faction.FactionPlugin
api-version: "1.21"
author: FactionDev
description: >
  Plugin de factions complet pour Paper 1.21.x — factions, alliances, guerres, claims, villages autonomes avec villageois recrutés, banque d'émeraudes, troc sécurisé, commerce inter-villes, shop global, statistiques, liaison site web (sans SQL), et synchronisation HeroTab. v5.15.4.

commands:
  faction:
    description: Commande principale des factions
    usage: /faction [sous-commande]
    aliases: [f, fac]
  tpa:
    description: Demande de téléportation à un joueur
    usage: /tpa <joueur>
  tpaccept:
    description: Accepter une demande de téléportation
    usage: /tpaccept
    aliases: [tpac]
  tpdeny:
    description: Refuser une demande de téléportation
    usage: /tpdeny
    aliases: [tpd]
  sethome:
    description: Définir un home personnel
    usage: /sethome [nom]
  home:
    description: Se téléporter à un home
    usage: /home [nom]
  delhome:
    description: Supprimer un home
    usage: /delhome <nom>
  homes:
    description: Lister ses homes
    usage: /homes
  lier:
    description: Lier son compte Minecraft au compte du site web
    usage: /lier [statut]

permissions:
  faction.use:
    description: Utiliser les commandes de faction
    default: true
  faction.admin:
    description: Commandes admin — invsee, bypass coffres privés
    default: op
