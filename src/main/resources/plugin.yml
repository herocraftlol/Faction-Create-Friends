name: FactionPlugin
version: 5.15.0
main: fr.faction.FactionPlugin
api-version: "1.21"
author: FactionDev
description: >
  Plugin de factions tout-en-un pour Paper 1.21.x — claims, alliances,
  guerres, banque d'émeraudes, troc sécurisé, commerce inter-villes →
  (ports 🚢 et gares 🚂), villages autonomes avec villageois recrutés
  (Constructeur, Guerrier, Récolteur, Navigateur, Cheminot), rangs
  Pierre→Légendaire, dissolution différée d'1h, accès aux coffres préservé
  pendant la dissolution, nettoyage automatique des factions fantômes,
  tab global HeroTab synchronisé à la seconde, stats joueurs, InvSee, TPA,
  liaison site web. v5.15.0 : la vraie cause du tab HeroTab est corrigée.

commands:
  faction:
    description: Commande principale des factions
    usage: /faction [sous-commande]
    aliases: [f, fac]
  tpa:
    description: Demande de téléportation à un joueur
    usage: /tpa <joueur>
  tpaccept:
    description: Accepter une demande de téléportation
    usage: /tpaccept
    aliases: [tpac]
  tpdeny:
    description: Refuser une demande de téléportation
    usage: /tpdeny
    aliases: [tpd]
  sethome:
    description: Définir un home personnel
    usage: /sethome [nom]
  home:
    description: Se téléporter à un home
    usage: /home [nom]
  delhome:
    description: Supprimer un home
    usage: /delhome <nom>
  homes:
    description: Lister ses homes
    usage: /homes
  lier:
    description: Lier son compte Minecraft au compte du site web
    usage: /lier [statut]

permissions:
  faction.use:
    description: Utiliser les commandes de faction
    default: true
  faction.admin:
    description: Commandes admin — invsee, bypass coffres privés
    default: op
