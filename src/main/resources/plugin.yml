name: FactionPlugin
version: 5.1.1
main: fr.faction.FactionPlugin
api-version: 1.20
author: FactionDev
description: >
  Plugin de factions complet — claims, alliances, guerre inter-factions,
  shop global, banque, troc, homes, coffres privés, TPA, InvSee, stats, classements.

commands:
  faction:
    description: Commande principale (alias /f /fac)
    usage: /faction [sous-commande]
    aliases: [f, fac]
  tpa:
    description: Demande de téléportation à un joueur
    usage: /tpa <joueur>
  tpaccept:
    description: Accepter une demande de téléportation
    usage: /tpaccept
    aliases: [tpac]
  tpdeny:
    description: Refuser une demande de téléportation
    usage: /tpdeny
    aliases: [tpd]
  sethome:
    description: Définir un home personnel (1 sans faction, 2 avec, 3 si allié)
    usage: /sethome [nom]
  home:
    description: Se téléporter à un home
    usage: /home [nom]
  delhome:
    description: Supprimer un home
    usage: /delhome <nom>
  homes:
    description: Lister ses homes
    usage: /homes

permissions:
  faction.use:
    description: Utiliser les commandes de faction
    default: true
  faction.admin:
    description: Commandes admin — invsee, bypass coffres privés
    default: op
